<svg width="800" height="220" viewBox="0 0 800 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');
      .title{font-family:'Outfit',sans-serif;font-weight:800;font-size:30px;fill:url(#tg);animation:pulse 4s ease-in-out infinite;}
      .sub-top{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11px;letter-spacing:2px;fill:#f59e0b;animation:fi 1.5s ease-out forwards;}
      .sub-bot{font-family:'Outfit',sans-serif;font-weight:400;font-size:14px;fill:#475569;animation:su 1.8s cubic-bezier(0.16,1,0.3,1) forwards;}
      .gl{stroke:#e2e8f0;stroke-dasharray:4 4;animation:gd 2s ease-out forwards;}
      .badge{font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;fill:#fff;}
      .bb{animation:fi 1s ease-out 2.5s forwards;opacity:0;}
      .bt{animation:fi 1s ease-out 2.5s forwards;opacity:0;}
      .pipe{stroke-width:2.5;stroke-linecap:round;fill:none;}
      .node{stroke-width:2;}
      .flow{stroke-dasharray:6 3;animation:flow 2s linear infinite;}
      @media(prefers-color-scheme:dark){.sub-bot{fill:#94a3b8;}.gl{stroke:#1e293b;}}
      @keyframes fi{to{opacity:1;}}
      @keyframes su{from{transform:translateY(15px);opacity:0;}to{transform:translateY(0);opacity:1;}}
      @keyframes pulse{0%,100%{filter:drop-shadow(0 0 3px rgba(245,158,11,0.3));}50%{filter:drop-shadow(0 0 12px rgba(99,102,241,0.5));}}
      @keyframes gd{from{stroke-dashoffset:40;opacity:0;}to{stroke-dashoffset:0;opacity:0.35;}}
      @keyframes flow{from{stroke-dashoffset:18;}to{stroke-dashoffset:0;}}
    </style>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="40%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="csvg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="jsong" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="apig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/><stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="dfg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="scaleg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background grid -->
  <line x1="30" y1="45"  x2="230" y2="45"  class="gl"/>
  <line x1="30" y1="85"  x2="230" y2="85"  class="gl"/>
  <line x1="30" y1="125" x2="230" y2="125" class="gl"/>
  <line x1="30" y1="165" x2="230" y2="165" class="gl"/>
  <line x1="50"  y1="25" x2="50"  y2="185" class="gl"/>
  <line x1="100" y1="25" x2="100" y2="185" class="gl"/>
  <line x1="150" y1="25" x2="150" y2="185" class="gl"/>
  <line x1="200" y1="25" x2="200" y2="185" class="gl"/>

  <!-- Source nodes -->
  <!-- CSV -->
  <rect x="20" y="35" width="44" height="28" rx="6" fill="url(#csvg)" filter="url(#glow)"/>
  <text x="42" y="54" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" fill="white">CSV</text>
  <!-- JSON -->
  <rect x="20" y="82" width="44" height="28" rx="6" fill="url(#jsong)" filter="url(#glow)"/>
  <text x="42" y="101" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" fill="white">JSON</text>
  <!-- API -->
  <rect x="20" y="129" width="44" height="28" rx="6" fill="url(#apig)" filter="url(#glow)"/>
  <text x="42" y="148" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="10" font-weight="700" fill="white">API</text>

  <!-- Flow lines to funnel -->
  <line x1="64" y1="49"  x2="100" y2="98" stroke="#10b981" stroke-width="1.8" class="flow" stroke-dasharray="5 3"/>
  <line x1="64" y1="96"  x2="100" y2="100" stroke="#f59e0b" stroke-width="1.8" class="flow" stroke-dasharray="5 3"/>
  <line x1="64" y1="143" x2="100" y2="108" stroke="#ec4899" stroke-width="1.8" class="flow" stroke-dasharray="5 3"/>

  <!-- Funnel (clean) -->
  <path d="M95 78 L150 78 L140 128 L105 128 Z" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" opacity="0.9"/>
  <text x="122" y="109" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="9" font-weight="700" fill="#6366f1">CLEAN</text>

  <!-- Arrow to Scale box -->
  <line x1="150" y1="103" x2="165" y2="103" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Scale box -->
  <rect x="165" y="82" width="48" height="42" rx="6" fill="url(#scaleg)" filter="url(#glow)"/>
  <text x="189" y="100" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="8" font-weight="700" fill="#fff">Scale</text>
  <text x="189" y="113" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="8" font-weight="700" fill="#fff">&amp; Encode</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Typography -->
  <text x="265" y="58" class="sub-top">DATA PREPROCESSING · FINAL PROJECT</text>
  <text x="265" y="110" class="title">Credit Risk Preprocessing</text>
  <text x="265" y="146" class="sub-bot">Imputation · Outliers · Encoding · Scaling · Feature Engineering</text>

  <!-- Badges -->
  <rect x="265" y="168" width="55" height="20" rx="4" fill="#064e3b" class="bb"/>
  <text x="292.5" y="182" text-anchor="middle" class="badge bt">CSV</text>

  <rect x="327" y="168" width="55" height="20" rx="4" fill="#78350f" class="bb"/>
  <text x="354.5" y="182" text-anchor="middle" class="badge bt">JSON</text>

  <rect x="389" y="168" width="48" height="20" rx="4" fill="#831843" class="bb"/>
  <text x="413" y="182" text-anchor="middle" class="badge bt">API</text>

  <rect x="444" y="168" width="62" height="20" rx="4" fill="#7f1d1d" class="bb"/>
  <text x="475" y="182" text-anchor="middle" class="badge bt">CLEANING</text>

  <rect x="513" y="168" width="70" height="20" rx="4" fill="#312e81" class="bb"/>
  <text x="548" y="182" text-anchor="middle" class="badge bt">ENCODING</text>

  <rect x="590" y="168" width="70" height="20" rx="4" fill="#4a044e" class="bb"/>
  <text x="625" y="182" text-anchor="middle" class="badge bt">SCALING</text>

  <rect x="667" y="168" width="92" height="20" rx="4" fill="#1e3a5f" class="bb"/>
  <text x="713" y="182" text-anchor="middle" class="badge bt">FEATURE ENG.</text>
</svg>
