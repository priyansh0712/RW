<svg width="600" height="200" viewBox="0 0 600 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');
      .panel-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 12px; }
      .panel-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 1px; fill: #475569; text-transform: uppercase; }
      .label-text { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 12.5px; fill: #0f172a; }
      .sub-text { font-family: 'Outfit', sans-serif; font-weight: 500; font-size: 10px; fill: #475569; }
      .spectrum-bar { fill: url(#spectrum-grad); rx: 4px; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 6px; }
      @media (prefers-color-scheme: dark) {
        .panel-bg { fill: #0f172a; stroke: #1e293b; }
        .panel-title { fill: #94a3b8; }
        .label-text { fill: #f8fafc; }
        .sub-text { fill: #94a3b8; }
        .box { fill: #1e293b; stroke: #334155; }
      }
    </style>
    <linearGradient id="spectrum-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="600" height="200" class="panel-bg" />
  
  <g transform="translate(18, 16)">
    <text x="0" y="14" class="panel-title">Model Diagnostics</text>
    <text x="0" y="32" class="label-text">Bias-Variance Spectrum Across the 5 Model Architectures</text>

    <!-- Spectrum Bar -->
    <rect x="0" y="52" width="560" height="8" class="spectrum-bar" />
    <text x="0" y="74" class="sub-text" style="font-weight:700; fill:#ef4444;">High Bias (Underfit)</text>
    <text x="280" y="74" text-anchor="middle" class="sub-text" style="font-weight:700; fill:#10b981;">Balanced (Optimal Fit)</text>
    <text x="560" y="74" text-anchor="end" class="sub-text" style="font-weight:700; fill:#f59e0b;">High Variance (Overfit)</text>

    <!-- 3 Categorical Boxes -->
    <g transform="translate(0, 88)">
      <!-- Underfit SVR -->
      <rect x="0" y="0" width="175" height="70" class="box" />
      <text x="12" y="20" class="label-text" style="fill:#ef4444; font-size:11px;">SVR (Linear/Poly/RBF)</text>
      <text x="12" y="36" class="sub-text">• High train &amp; test RMSE (~₹89L)</text>
      <text x="12" y="50" class="sub-text">• Unscaled target / low C penalty</text>
      <text x="12" y="64" class="sub-text" style="color:#ef4444; font-weight:600;">Diagnosis: Severe Underfitting</text>

      <!-- Balanced Ridge/Lasso/Tree -->
      <rect x="190" y="0" width="180" height="70" class="box" />
      <text x="12" y="20" class="label-text" style="fill:#10b981; font-size:11px;">Ridge, Lasso &amp; Dec Tree</text>
      <text x="12" y="36" class="sub-text">• Generalization gap &lt; 2.3%</text>
      <text x="12" y="50" class="sub-text">• Regularized weights / pruned</text>
      <text x="12" y="64" class="sub-text" style="color:#10b981; font-weight:600;">Diagnosis: Robust Good Fit</text>

      <!-- Random Forest -->
      <rect x="385" y="0" width="175" height="70" class="box" />
      <text x="12" y="20" class="label-text" style="fill:#ea580c; font-size:11px;">Random Forest (100 Trees)</text>
      <text x="12" y="36" class="sub-text">• Train RMSE: ₹8.94L (low)</text>
      <text x="12" y="50" class="sub-text">• Test RMSE: ₹24.06L (Champion)</text>
      <text x="12" y="64" class="sub-text" style="color:#ea580c; font-weight:600;">Diagnosis: Overfit, Best Test</text>
    </g>
  </g>
</svg>