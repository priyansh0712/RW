<svg width="600" height="210" viewBox="0 0 600 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');
      .panel-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 12px; }
      .panel-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 1px; fill: #475569; text-transform: uppercase; }
      .label-text { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
      .sub-text { font-family: 'Outfit', sans-serif; font-weight: 500; font-size: 10.5px; fill: #475569; }
      .math-text { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11.5px; fill: #1e1b4b; }
      .box { rx: 8px; stroke-width: 1.5; }
      @media (prefers-color-scheme: dark) {
        .panel-bg { fill: #0f172a; stroke: #1e293b; }
        .panel-title { fill: #94a3b8; }
        .label-text { fill: #f8fafc; }
        .sub-text { fill: #94a3b8; }
        .math-text { fill: #ffffff; }
      }
    </style>
  </defs>
  <rect width="600" height="210" class="panel-bg" />

  <g transform="translate(20, 16)">
    <text x="0" y="14" class="panel-title">Q3 &amp; Q4 Error Cost Analysis</text>
    <text x="0" y="32" class="label-text">Type-I Error (False Alarm) vs Type-II Error (Default Loss)</text>

    <!-- Left Box: Type-I Error -->
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="270" height="135" class="box" fill="#fffbeb" stroke="#f59e0b" />
      <text x="14" y="22" class="label-text" style="fill:#d97706;">⚠️ Type-I Error (False Positive)</text>
      
      <rect x="14" y="34" width="242" height="28" rx="4" fill="#fef3c7" />
      <text x="22" y="52" class="math-text" style="fill:#b45309;">Predict High Risk (1) | Actual Low Risk (0)</text>

      <text x="14" y="80" class="sub-text">✔ Unnecessary security alerts</text>
      <text x="14" y="98" class="sub-text">✔ Temporary card freeze or manual review</text>
      <text x="14" y="116" class="sub-text">✔ Moderate customer friction</text>
      <text x="14" y="132" class="sub-text" style="fill:#d97706; font-weight:700;">Cost: Minor Operational Friction</text>
    </g>

    <!-- Right Box: Type-II Error -->
    <g transform="translate(290, 44)">
      <rect x="0" y="0" width="270" height="135" class="box" fill="#fef2f2" stroke="#ef4444" />
      <text x="14" y="22" class="label-text" style="fill:#dc2626;">🚨 Type-II Error (False Negative)</text>
      
      <rect x="14" y="34" width="242" height="28" rx="4" fill="#fee2e2" />
      <text x="22" y="52" class="math-text" style="fill:#991b1b;">Predict Low Risk (0) | Actual High Risk (1)</text>

      <text x="14" y="80" class="sub-text">❌ Severe loan/credit default</text>
      <text x="14" y="98" class="sub-text">❌ Direct unrecoverable financial loss</text>
      <text x="14" y="116" class="sub-text">❌ Regulatory credit audit risk</text>
      <text x="14" y="132" class="sub-text" style="fill:#dc2626; font-weight:700;">Priority: Maximize Recall (Zero Misses)</text>
    </g>
  </g>
</svg>
