<svg width="600" height="210" viewBox="0 0 600 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');
      .panel-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 12px; }
      .panel-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 1px; fill: #475569; text-transform: uppercase; }
      .label-text { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 13px; fill: #0f172a; }
      .sub-text { font-family: 'Outfit', sans-serif; font-weight: 500; font-size: 10.5px; fill: #475569; }
      .math-text { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11.5px; fill: #1e1b4b; }
      .box { rx: 8px; stroke-width: 1.5; fill: #ffffff; stroke: #cbd5e1; }
      @media (prefers-color-scheme: dark) {
        .panel-bg { fill: #0f172a; stroke: #1e293b; }
        .panel-title { fill: #94a3b8; }
        .label-text { fill: #f8fafc; }
        .sub-text { fill: #94a3b8; }
        .math-text { fill: #ffffff; }
        .box { fill: #1e293b; stroke: #334155; }
      }
    </style>
  </defs>
  <rect width="600" height="210" class="panel-bg" />

  <g transform="translate(20, 16)">
    <text x="0" y="14" class="panel-title">Part E Tree Ensembles</text>
    <text x="0" y="32" class="label-text">Bagging Architecture: Single Decision Tree vs Random Forest (219 Trees)</text>

    <!-- Left Box: Decision Tree (High Variance) -->
    <g transform="translate(0, 44)">
      <rect x="0" y="0" width="270" height="135" class="box" />
      <text x="14" y="20" class="label-text" style="fill:#ef4444;">🌲 Single Decision Tree</text>
      
      <!-- Mini tree -->
      <line x1="60" y1="45" x2="35" y2="70" stroke="#64748b" stroke-width="1.5" />
      <line x1="60" y1="45" x2="85" y2="70" stroke="#64748b" stroke-width="1.5" />
      <line x1="35" y1="70" x2="20" y2="95" stroke="#64748b" stroke-width="1.5" />
      <line x1="35" y1="70" x2="50" y2="95" stroke="#64748b" stroke-width="1.5" />

      <circle cx="60" cy="45" r="5" fill="#ef4444" />
      <circle cx="35" cy="70" r="4.5" fill="#f59e0b" />
      <circle cx="85" cy="70" r="4.5" fill="#f59e0b" />
      <circle cx="20" cy="95" r="3.5" fill="#3b82f6" />
      <circle cx="50" cy="95" r="3.5" fill="#10b981" />

      <text x="115" y="48" class="math-text">Train: 100% | Test: 97.07%</text>
      <text x="115" y="66" class="sub-text">✔ Hierarchical greedy splits</text>
      <text x="115" y="84" class="sub-text">❌ Severe overfitting</text>
      <text x="115" y="102" class="sub-text">❌ High variance error</text>
      <text x="115" y="120" class="sub-text" style="fill:#ef4444; font-weight:700;">Low Test Recall (86.5%)</text>
    </g>

    <!-- Right Box: Random Forest Bagging -->
    <g transform="translate(290, 44)">
      <rect x="0" y="0" width="270" height="135" class="box" />
      <text x="14" y="20" class="label-text" style="fill:#10b981;">🌳🌳🌳 Random Forest (Bagging)</text>
      
      <!-- 3 small tree icons -->
      <g transform="translate(18, 45)">
        <polygon points="18,0 4,24 32,24" fill="#10b981" />
        <rect x="14" y="24" width="8" height="8" fill="#475569" />
      </g>
      <g transform="translate(48, 40)">
        <polygon points="18,0 4,24 32,24" fill="#059669" />
        <rect x="14" y="24" width="8" height="8" fill="#475569" />
      </g>
      <g transform="translate(78, 45)">
        <polygon points="18,0 4,24 32,24" fill="#10b981" />
        <rect x="14" y="24" width="8" height="8" fill="#475569" />
      </g>

      <text x="63" y="90" text-anchor="middle" class="math-text" style="fill:#047857;">Majority Vote</text>

      <text x="125" y="48" class="math-text">Tuned Recall: 98.20%</text>
      <text x="125" y="66" class="sub-text">✔ 219 Decorrelated Trees</text>
      <text x="125" y="84" class="sub-text">✔ Feature Subsampling (√p)</text>
      <text x="125" y="102" class="sub-text">✔ Reduces variance</text>
      <text x="125" y="120" class="sub-text" style="fill:#10b981; font-weight:700;">Champion Ensemble</text>
    </g>
  </g>
</svg>
