<svg width="800" height="220" viewBox="0 0 800 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');
      .title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 29px; fill: url(#title-grad); animation: text-pulse 4s ease-in-out infinite; }
      .sub-top { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 2px; fill: #10b981; animation: fi 1.5s ease-out forwards; }
      .sub-bot { font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 14.5px; fill: #475569; animation: su 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .gl { stroke: #e2e8f0; stroke-dasharray: 4 4; opacity: 0.4; }
      .badge { font-family: 'Space Grotesk', sans-serif; font-size: 9.5px; font-weight: 700; fill: #ffffff; }
      .bb { animation: fi 1s ease-out 2.5s forwards; opacity: 0; }
      .bt { animation: fi 1s ease-out 2.5s forwards; opacity: 0; }
      .svm-line { stroke: url(#svm-grad); stroke-width: 2.5; stroke-linecap: round; fill: none; }
      .margin { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
      @media (prefers-color-scheme: dark) { .sub-bot { fill: #94a3b8; } .gl { stroke: #1e293b; } }
      @keyframes fi { to { opacity: 1; } }
      @keyframes su { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
      @keyframes text-pulse { 0%, 100% { filter: drop-shadow(0 0 2px rgba(16, 185, 129, 0.3)); } 50% { filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.5)); } }
    </style>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="35%" stop-color="#6366f1"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="svm-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Left Graphic: SVM Decision Boundary -->
  <g transform="translate(18, 20)">
    <line x1="20" y1="20" x2="190" y2="20" class="gl"/>
    <line x1="20" y1="65" x2="190" y2="65" class="gl"/>
    <line x1="20" y1="110" x2="190" y2="110" class="gl"/>
    <line x1="20" y1="155" x2="190" y2="155" class="gl"/>
    <line x1="20" y1="20" x2="20" y2="155" class="gl"/>
    <line x1="62" y1="20" x2="62" y2="155" class="gl"/>
    <line x1="105" y1="20" x2="105" y2="155" class="gl"/>
    <line x1="148" y1="20" x2="148" y2="155" class="gl"/>
    <line x1="190" y1="20" x2="190" y2="155" class="gl"/>

    <!-- SVM Decision Boundary Line -->
    <line x1="25" y1="150" x2="115" y2="150" stroke="#64748b" stroke-width="1.8"/>
    <line x1="25" y1="150" x2="25" y2="60" stroke="#64748b" stroke-width="1.8"/>
    <line x1="30" y1="145" x2="108" y2="65" class="svm-line" filter="url(#glow)"/>
    <line x1="35" y1="150" x2="113" y2="70" class="margin"/>
    <line x1="25" y1="140" x2="103" y2="60" class="margin"/>

    <!-- Class dots: spam (red) and legit (blue) -->
    <circle cx="45" cy="130" r="5" fill="#3b82f6" opacity="0.9"/>
    <circle cx="55" cy="120" r="5" fill="#3b82f6" opacity="0.9"/>
    <circle cx="40" cy="115" r="5" fill="#3b82f6" opacity="0.9"/>
    <circle cx="35" cy="135" r="5" fill="#3b82f6" opacity="0.9"/>
    <circle cx="80" cy="95" r="5" fill="#ef4444" opacity="0.9" filter="url(#glow)"/>
    <circle cx="92" cy="85" r="5" fill="#ef4444" opacity="0.9" filter="url(#glow)"/>
    <circle cx="85" cy="75" r="5" fill="#ef4444" opacity="0.9" filter="url(#glow)"/>
    <circle cx="100" cy="100" r="5" fill="#ef4444" opacity="0.9"/>
    <text x="108" y="108" font-family="Space Grotesk,sans-serif" font-size="8.5" font-weight="700" fill="#10b981">99.52%</text>
    <text x="110" y="172" text-anchor="middle" font-family="Space Grotesk,sans-serif" font-size="9" font-weight="700" fill="#64748b">SVM DECISION BOUNDARY</text>
  </g>

  <!-- Typography Content -->
  <g transform="translate(245, 0)">
    <text x="0" y="55" class="sub-top">MACHINE LEARNING · PR 4</text>
    <text x="0" y="100" class="title">Spam Message Classification Pipeline</text>
    <text x="0" y="136" class="sub-bot">KNN · Linear SVM · RBF SVM · Naive Bayes · Feature Engineering</text>

    <!-- Badges -->
    <rect x="0" y="168" width="80" height="22" rx="4" fill="#064e3b" class="bb"/>
    <text x="40" y="183" text-anchor="middle" class="badge bt">DATA.CSV</text>

    <rect x="88" y="168" width="100" height="22" rx="4" fill="#312e81" class="bb"/>
    <text x="138" y="183" text-anchor="middle" class="badge bt">LINEAR SVM</text>

    <rect x="196" y="168" width="80" height="22" rx="4" fill="#701a75" class="bb"/>
    <text x="236" y="183" text-anchor="middle" class="badge bt">NAIVE BAYES</text>

    <rect x="284" y="168" width="58" height="22" rx="4" fill="#7f1d1d" class="bb"/>
    <text x="313" y="183" text-anchor="middle" class="badge bt">KNN</text>

    <rect x="350" y="168" width="100" height="22" rx="4" fill="#1e3a5f" class="bb"/>
    <text x="400" y="183" text-anchor="middle" class="badge bt">ACC 99.52%</text>
  </g>
</svg>
