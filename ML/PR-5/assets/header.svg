<svg width="800" height="230" viewBox="0 0 800 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');
      .title { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 28px; fill: url(#title-grad); animation: text-pulse 4s ease-in-out infinite; }
      .sub-top { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 2px; fill: #6366f1; }
      .sub-bot { font-family: 'Outfit', sans-serif; font-weight: 400; font-size: 14px; fill: #475569; }
      .gl { stroke: #e2e8f0; stroke-dasharray: 4 4; opacity: 0.5; }
      .badge { font-family: 'Space Grotesk', sans-serif; font-size: 9.5px; font-weight: 700; fill: #ffffff; }
      .ensemble-box { rx: 6px; stroke-width: 1.5; }
      @media (prefers-color-scheme: dark) {
        .sub-bot { fill: #94a3b8; }
        .gl { stroke: #1e293b; }
      }
      @keyframes text-pulse {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(99, 102, 241, 0.3)); }
        50% { filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.5)); }
      }
    </style>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="30%" stop-color="#8b5cf6"/>
      <stop offset="65%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-boost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="card-stack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Left Graphic: Architectural Ensemble Node Diagram -->
  <g transform="translate(20, 20)">
    <rect x="0" y="0" width="200" height="190" rx="10" fill="url(#grad-card)" stroke="#334155" stroke-width="1.5"/>
    <text x="15" y="25" font-family="'Space Grotesk', sans-serif" font-size="10px" font-weight="700" fill="#38bdf8" letter-spacing="1.5px">ENSEMBLE TOPOLOGY</text>

    <!-- Base Models -->
    <rect x="15" y="42" width="50" height="26" rx="4" fill="#3b82f6" opacity="0.9"/>
    <text x="40" y="58" font-family="'Space Grotesk', sans-serif" font-size="9px" font-weight="700" fill="#ffffff" text-anchor="middle">Bagging</text>

    <rect x="15" y="76" width="50" height="26" rx="4" fill="#8b5cf6" opacity="0.9"/>
    <text x="40" y="92" font-family="'Space Grotesk', sans-serif" font-size="9px" font-weight="700" fill="#ffffff" text-anchor="middle">Boosting</text>

    <rect x="15" y="110" width="50" height="26" rx="4" fill="#ec4899" opacity="0.9"/>
    <text x="40" y="126" font-family="'Space Grotesk', sans-serif" font-size="9px" font-weight="700" fill="#ffffff" text-anchor="middle">Voting</text>

    <rect x="15" y="144" width="50" height="26" rx="4" fill="#f59e0b" opacity="0.9"/>
    <text x="40" y="160" font-family="'Space Grotesk', sans-serif" font-size="9px" font-weight="700" fill="#ffffff" text-anchor="middle">Stacking</text>

    <!-- Connectors -->
    <path d="M 65 55 L 110 95" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M 65 89 L 110 95" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M 65 123 L 110 115" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M 65 157 L 110 115" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Dual Target Meta Estimators -->
    <rect x="110" y="70" width="75" height="32" rx="5" fill="url(#card-boost)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="147" y="84" font-family="'Space Grotesk', sans-serif" font-size="8px" font-weight="700" fill="#bfdbfe" text-anchor="middle">CLASSIFICATION</text>
    <text x="147" y="96" font-family="'Outfit', sans-serif" font-size="10px" font-weight="800" fill="#ffffff" text-anchor="middle">GradBoost 73%</text>

    <rect x="110" y="112" width="75" height="32" rx="5" fill="url(#card-stack)" stroke="#34d399" stroke-width="1.5"/>
    <text x="147" y="126" font-family="'Space Grotesk', sans-serif" font-size="8px" font-weight="700" fill="#a7f3d0" text-anchor="middle">REGRESSION</text>
    <text x="147" y="138" font-family="'Outfit', sans-serif" font-size="10px" font-weight="800" fill="#ffffff" text-anchor="middle">Stacking R² 0.49</text>
  </g>

  <!-- Right Graphic: Title & Badges -->
  <g transform="translate(245, 30)">
    <text x="0" y="15" class="sub-top">END-TO-END MACHINE LEARNING BENCHMARK</text>
    <text x="0" y="48" class="title">Smart Outcome Predictor</text>
    <text x="0" y="74" class="sub-bot">Dual Classification &amp; Regression Machine Learning Pipeline</text>
    <text x="0" y="94" class="sub-bot">Bagging · AdaBoost · Gradient Boosting · XGBoost · Voting · Stacking</text>

    <!-- Metric Pill Badges -->
    <g transform="translate(0, 115)">
      <rect x="0" y="0" width="125" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="10" y="14" font-family="'Space Grotesk', sans-serif" font-size="8.5px" font-weight="600" fill="#94a3b8">DATASET SIZE</text>
      <text x="10" y="27" font-family="'Space Grotesk', sans-serif" font-size="12px" font-weight="700" fill="#38bdf8">5,200 Records</text>

      <rect x="135" y="0" width="135" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="145" y="14" font-family="'Space Grotesk', sans-serif" font-size="8.5px" font-weight="600" fill="#94a3b8">BEST CLASSIFIER</text>
      <text x="145" y="27" font-family="'Space Grotesk', sans-serif" font-size="12px" font-weight="700" fill="#34d399">GradBoost (72.4% F1)</text>

      <rect x="280" y="0" width="135" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="290" y="14" font-family="'Space Grotesk', sans-serif" font-size="8.5px" font-weight="600" fill="#94a3b8">BEST REGRESSOR</text>
      <text x="290" y="27" font-family="'Space Grotesk', sans-serif" font-size="12px" font-weight="700" fill="#fbbf24">Stacking (9.79 RMSE)</text>

      <rect x="425" y="0" width="105" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="435" y="14" font-family="'Space Grotesk', sans-serif" font-size="8.5px" font-weight="600" fill="#94a3b8">MODELS BENCHED</text>
      <text x="435" y="27" font-family="'Space Grotesk', sans-serif" font-size="12px" font-weight="700" fill="#f472b6">12 Architectures</text>
    </g>
  </g>
</svg>