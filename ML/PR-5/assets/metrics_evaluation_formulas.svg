<svg width="800" height="215" viewBox="0 0 800 215" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&amp;family=Space+Grotesk:wght@600;700&amp;display=swap');
      .panel-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5; rx: 12px; }
      .card-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8px; }
      .metric-name { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; }
      .formula-box { fill: #f1f5f9; rx: 5px; }
      .formula-text { font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .obj-text { font-family: 'Outfit', sans-serif; font-size: 10.5px; font-weight: 500; fill: #475569; }
      @media (prefers-color-scheme: dark) {
        .panel-bg { fill: #0f172a; stroke: #1e293b; }
        .card-bg { fill: #1e293b; stroke: #334155; }
        .formula-box { fill: #0f172a; }
        .formula-text { fill: #f8fafc; }
        .obj-text { fill: #94a3b8; }
      }
    </style>
  </defs>

  <rect width="800" height="215" class="panel-bg" />

  <!-- Classification Metrics (Left) -->
  <!-- Card 1: Weighted F1-Score -->
  <g transform="translate(18, 16)">
    <rect x="0" y="0" width="372" height="85" class="card-bg" style="stroke:#3b82f6; stroke-width:1.5;"/>
    <rect x="0" y="0" width="6" height="85" rx="3" fill="#3b82f6" />
    <text x="18" y="24" class="metric-name" style="fill:#2563eb;">🎯 Weighted F1-Score (Classification)</text>
    <rect x="18" y="34" width="145" height="34" class="formula-box" />
    <text x="90" y="55" text-anchor="middle" class="formula-text">2 · (P · R) / (P + R)</text>
    <text x="175" y="44" class="obj-text">• Harmonic mean of Precision &amp; Recall</text>
    <text x="175" y="62" class="obj-text">• Weighted by class sample prevalence</text>
  </g>

  <!-- Card 2: ROC-AUC -->
  <g transform="translate(18, 114)">
    <rect x="0" y="0" width="372" height="85" class="card-bg" />
    <rect x="0" y="0" width="6" height="85" rx="3" fill="#8b5cf6" />
    <text x="18" y="24" class="metric-name" style="fill:#7c3aed;">📈 ROC-AUC Score</text>
    <rect x="18" y="34" width="145" height="34" class="formula-box" />
    <text x="90" y="55" text-anchor="middle" class="formula-text">∫ TPR(FPR) d(FPR)</text>
    <text x="175" y="44" class="obj-text">• Probability ranking discriminability</text>
    <text x="175" y="62" class="obj-text">• Threshold-invariant classification skill</text>
  </g>

  <!-- Regression Metrics (Right) -->
  <!-- Card 3: Root Mean Squared Error (RMSE) -->
  <g transform="translate(410, 16)">
    <rect x="0" y="0" width="372" height="85" class="card-bg" style="stroke:#10b981; stroke-width:1.5;" />
    <rect x="0" y="0" width="6" height="85" rx="3" fill="#10b981" />
    <text x="18" y="24" class="metric-name" style="fill:#059669;">⭐ RMSE (Key Regression Metric)</text>
    <rect x="18" y="34" width="145" height="34" class="formula-box" />
    <text x="90" y="55" text-anchor="middle" class="formula-text">√[ Σ(yᵢ - ŷᵢ)² / n ]</text>
    <text x="175" y="44" class="obj-text" style="font-weight:700; fill:#059669;">• Heavily penalizes large outlier errors</text>
    <text x="175" y="62" class="obj-text">• Expressed in original final score units</text>
  </g>

  <!-- Card 4: Coefficient of Determination (R²) -->
  <g transform="translate(410, 114)">
    <rect x="0" y="0" width="372" height="85" class="card-bg" />
    <rect x="0" y="0" width="6" height="85" rx="3" fill="#f59e0b" />
    <text x="18" y="24" class="metric-name" style="fill:#d97706;">📊 R² Score (Explained Variance)</text>
    <rect x="18" y="34" width="145" height="34" class="formula-box" />
    <text x="90" y="55" text-anchor="middle" class="formula-text">1 - (SS_res / SS_tot)</text>
    <text x="175" y="44" class="obj-text">• Proportion of variance explained by model</text>
    <text x="175" y="62" class="obj-text">• Baseline mean model has R² = 0.0</text>
  </g>
</svg>