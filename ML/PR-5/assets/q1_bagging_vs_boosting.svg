<svg width="800" height="230" viewBox="0 0 800 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');
      .c-title { font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 700; }
      .c-sub { font-family: 'Space Grotesk', sans-serif; font-size: 11px; fill: #64748b; font-weight: 500; }
      .box { rx: 6px; stroke-width: 1.2; }
      .txt { font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 600; }
      @media (prefers-color-scheme: dark) {
        .c-title { fill: #f8fafc; }
        .c-sub { fill: #94a3b8; }
      }
    </style>
  </defs>

  <rect width="800" height="230" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left: Bagging (Parallel) -->
  <g transform="translate(20, 16)">
    <rect x="0" y="0" width="365" height="198" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="365" height="4" rx="2" fill="#3b82f6"/>
    <text x="16" y="24" class="c-title" fill="#1e40af">🌲 Bagging (Bootstrap Aggregation)</text>
    <text x="16" y="42" class="c-sub">Parallel training on random bootstrap samples · Reduces Variance</text>

    <!-- Data to Bootstrap Samples -->
    <rect x="16" y="60" width="65" height="110" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="48" y="110" font-family="'Space Grotesk', sans-serif" font-size="11px" font-weight="700" fill="#1e3a8a" text-anchor="middle">Train<br/>Data</text>

    <!-- Parallel Trees -->
    <g transform="translate(100, 60)">
      <rect x="0" y="0" width="130" height="30" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="65" y="19" class="txt" fill="#1e40af" text-anchor="middle">Base Model 1 (Tree)</text>

      <rect x="0" y="40" width="130" height="30" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="65" y="59" class="txt" fill="#1e40af" text-anchor="middle">Base Model 2 (Tree)</text>

      <rect x="0" y="80" width="130" height="30" rx="4" fill="#dbeafe" stroke="#3b82f6"/>
      <text x="65" y="99" class="txt" fill="#1e40af" text-anchor="middle">Base Model B (Tree)</text>
    </g>

    <!-- Aggregator -->
    <g transform="translate(250, 85)">
      <rect x="0" y="0" width="100" height="55" rx="5" fill="#1e40af"/>
      <text x="50" y="24" font-family="'Space Grotesk', sans-serif" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">Average / Vote</text>
      <text x="50" y="42" font-family="'Space Grotesk', sans-serif" font-size="9.5px" fill="#bfdbfe" text-anchor="middle">Final Output ŷ</text>
    </g>
  </g>

  <!-- Right: Boosting (Sequential) -->
  <g transform="translate(415, 16)">
    <rect x="0" y="0" width="365" height="198" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="365" height="4" rx="2" fill="#ec4899"/>
    <text x="16" y="24" class="c-title" fill="#9d174d">🚀 Boosting (Sequential Error Correction)</text>
    <text x="16" y="42" class="c-sub">Iterative training focusing on residual errors · Reduces Bias</text>

    <!-- Step 1 -->
    <rect x="16" y="65" width="85" height="60" rx="5" fill="#fdf2f8" stroke="#f472b6"/>
    <text x="58" y="90" font-family="'Space Grotesk', sans-serif" font-size="10.5px" font-weight="700" fill="#831843" text-anchor="middle">Model 1</text>
    <text x="58" y="108" font-family="'Space Grotesk', sans-serif" font-size="9px" fill="#9d174d" text-anchor="middle">Weak Learner</text>

    <!-- Arrow 1 -> 2 -->
    <path d="M 105 95 L 130 95" stroke="#db2777" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Step 2 -->
    <rect x="135" y="65" width="85" height="60" rx="5" fill="#fdf2f8" stroke="#f472b6"/>
    <text x="177" y="90" font-family="'Space Grotesk', sans-serif" font-size="10.5px" font-weight="700" fill="#831843" text-anchor="middle">Model 2</text>
    <text x="177" y="108" font-family="'Space Grotesk', sans-serif" font-size="9px" fill="#9d174d" text-anchor="middle">Fits Residuals</text>

    <!-- Arrow 2 -> 3 -->
    <path d="M 224 95 L 249 95" stroke="#db2777" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Step 3 -->
    <rect x="254" y="65" width="95" height="60" rx="5" fill="#831843"/>
    <text x="301" y="90" font-family="'Space Grotesk', sans-serif" font-size="10.5px" font-weight="700" fill="#ffffff" text-anchor="middle">Model M</text>
    <text x="301" y="108" font-family="'Space Grotesk', sans-serif" font-size="9px" fill="#fbcfe8" text-anchor="middle">Weighted Sum</text>

    <!-- Bottom summary banner -->
    <rect x="16" y="145" width="333" height="35" rx="4" fill="#fce7f3"/>
    <text x="182" y="167" font-family="'Space Grotesk', sans-serif" font-size="10.5px" font-weight="600" fill="#9d174d" text-anchor="middle">F_M(x) = F_{M-1}(x) + η · h_M(x) [Shrinkage Rate η]</text>
  </g>
</svg>