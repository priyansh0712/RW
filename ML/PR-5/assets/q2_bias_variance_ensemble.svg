<svg width="800" height="210" viewBox="0 0 800 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');
      .c-title { font-family: 'Outfit', sans-serif; font-size: 13.5px; font-weight: 700; }
      .c-sub { font-family: 'Space Grotesk', sans-serif; font-size: 11px; fill: #64748b; }
      @media (prefers-color-scheme: dark) {
        .c-title { fill: #f8fafc; }
        .c-sub { fill: #94a3b8; }
      }
    </style>
  </defs>

  <rect width="800" height="210" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Panel 1: Bias-Variance Decomposition -->
  <g transform="translate(18, 16)">
    <rect x="0" y="0" width="240" height="178" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="240" height="4" rx="2" fill="#6366f1"/>
    <text x="14" y="24" class="c-title" fill="#4338ca">🎯 Total Expected Error</text>
    <text x="14" y="42" class="c-sub">Error Decomposition Formula</text>

    <rect x="14" y="55" width="212" height="40" rx="5" fill="#e0e7ff"/>
    <text x="120" y="79" font-family="'Space Grotesk', sans-serif" font-size="11.5px" font-weight="700" fill="#312e81" text-anchor="middle">Bias² + Variance + σ²</text>

    <text x="14" y="115" font-family="'Outfit', sans-serif" font-size="10.5px" fill="#475569">• Bias: Underfitting systematic error</text>
    <text x="14" y="133" font-family="'Outfit', sans-serif" font-size="10.5px" fill="#475569">• Variance: Overfitting data sensitivity</text>
    <text x="14" y="151" font-family="'Outfit', sans-serif" font-size="10.5px" fill="#475569">• σ²: Irreducible stochastic noise</text>
  </g>

  <!-- Panel 2: Bagging Mechanism -->
  <g transform="translate(272, 16)">
    <rect x="0" y="0" width="250" height="178" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="250" height="4" rx="2" fill="#3b82f6"/>
    <text x="14" y="24" class="c-title" fill="#1d4ed8">🌲 Bagging: Variance Reduction</text>
    <text x="14" y="42" class="c-sub">Averaging B Independent Estimators</text>

    <rect x="14" y="55" width="222" height="40" rx="5" fill="#dbeafe"/>
    <text x="125" y="79" font-family="'Space Grotesk', sans-serif" font-size="11.5px" font-weight="700" fill="#1e40af" text-anchor="middle">Var(f̄) = ρ·σ² + [(1 - ρ)/B] · σ²</text>

    <text x="14" y="115" font-family="'Outfit', sans-serif" font-size="10.5px" fill="#475569">• As B (trees) ↑, variance drops by 1/B</text>
    <text x="14" y="133" font-family="'Outfit', sans-serif" font-size="10.5px" fill="#475569">• Base learners have low bias, high var</text>
    <text x="14" y="151" font-family="'Outfit', sans-serif" font-size="10.5px" font-weight="700" fill="#2563eb">• Net Effect: Greatly reduced variance</text>
  </g>

  <!-- Panel 3: Boosting Mechanism -->
  <g transform="translate(536, 16)">
    <rect x="0" y="0" width="246" height="178" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="246" height="4" rx="2" fill="#ec4899"/>
    <text x="14" y="24" class="c-title" fill="#be185d">🚀 Boosting: Bias Reduction</text>
    <text x="14" y="42" class="c-sub">Additive Functional Gradient Descent</text>

    <rect x="14" y="55" width="218" height="40" rx="5" fill="#fce7f3"/>
    <text x="123" y="79" font-family="'Space Grotesk', sans-serif" font-size="11.5px" font-weight="700" fill="#831843" text-anchor="middle">F_m(x) = F_{m-1}(x) + η·h_m(x)</text>

    <text x="14" y="115" font-family="'Outfit', sans-serif" font-size="10.5px" fill="#475569">• Base learners have high bias (stumps)</text>
    <text x="14" y="133" font-family="'Outfit', sans-serif" font-size="10.5px" fill="#475569">• Iteratively fits negative gradients</text>
    <text x="14" y="151" font-family="'Outfit', sans-serif" font-size="10.5px" font-weight="700" fill="#db2777">• Net Effect: Systematically reduces bias</text>
  </g>
</svg>