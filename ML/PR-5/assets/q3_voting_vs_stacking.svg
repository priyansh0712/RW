<svg width="800" height="210" viewBox="0 0 800 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');
      .c-title { font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 700; }
      .c-sub { font-family: 'Space Grotesk', sans-serif; font-size: 11px; fill: #64748b; }
      @media (prefers-color-scheme: dark) {
        .c-title { fill: #f8fafc; }
        .c-sub { fill: #94a3b8; }
      }
    </style>
  </defs>

  <rect width="800" height="210" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left: Voting Ensemble -->
  <g transform="translate(20, 16)">
    <rect x="0" y="0" width="365" height="178" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="365" height="4" rx="2" fill="#06b6d4"/>
    <text x="16" y="24" class="c-title" fill="#0e7490">🗳️ Voting Ensemble (Heuristic Fusion)</text>
    <text x="16" y="42" class="c-sub">Direct heuristic combination with equal or static weights</text>

    <!-- Base Models -->
    <g transform="translate(16, 55)">
      <rect x="0" y="0" width="100" height="30" rx="4" fill="#cffafe" stroke="#06b6d4"/>
      <text x="50" y="19" font-family="'Space Grotesk', sans-serif" font-size="10.5px" font-weight="600" fill="#083344" text-anchor="middle">Decision Tree</text>

      <rect x="0" y="38" width="100" height="30" rx="4" fill="#cffafe" stroke="#06b6d4"/>
      <text x="50" y="57" font-family="'Space Grotesk', sans-serif" font-size="10.5px" font-weight="600" fill="#083344" text-anchor="middle">Random Forest</text>

      <rect x="0" y="76" width="100" height="30" rx="4" fill="#cffafe" stroke="#06b6d4"/>
      <text x="50" y="95" font-family="'Space Grotesk', sans-serif" font-size="10.5px" font-weight="600" fill="#083344" text-anchor="middle">AdaBoost</text>
    </g>

    <!-- Direct Fusion -->
    <g transform="translate(150, 68)">
      <rect x="0" y="0" width="195" height="75" rx="5" fill="#0891b2"/>
      <text x="97" y="26" font-family="'Space Grotesk', sans-serif" font-size="11.5px" font-weight="700" fill="#ffffff" text-anchor="middle">Hard Voting: mode(y₁,...,yₘ)</text>
      <text x="97" y="48" font-family="'Space Grotesk', sans-serif" font-size="11.5px" font-weight="700" fill="#cffafe" text-anchor="middle">Soft Voting: argmax Σ P(y|x)</text>
      <text x="97" y="65" font-family="'Space Grotesk', sans-serif" font-size="9px" fill="#e0f2fe" text-anchor="middle">No learnable meta-parameters</text>
    </g>
  </g>

  <!-- Right: Stacking Ensemble -->
  <g transform="translate(415, 16)">
    <rect x="0" y="0" width="365" height="178" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="0" y="0" width="365" height="4" rx="2" fill="#10b981"/>
    <text x="16" y="24" class="c-title" fill="#065f46">🥞 Stacking Ensemble (Meta-Learner Fusion)</text>
    <text x="16" y="42" class="c-sub">Base model predictions serve as features for a Meta-Model</text>

    <!-- Base Models -->
    <g transform="translate(16, 55)">
      <rect x="0" y="0" width="95" height="30" rx="4" fill="#d1fae5" stroke="#10b981"/>
      <text x="47" y="19" font-family="'Space Grotesk', sans-serif" font-size="10.5px" font-weight="600" fill="#064e3b" text-anchor="middle">Base Model 1</text>

      <rect x="0" y="38" width="95" height="30" rx="4" fill="#d1fae5" stroke="#10b981"/>
      <text x="47" y="57" font-family="'Space Grotesk', sans-serif" font-size="10.5px" font-weight="600" fill="#064e3b" text-anchor="middle">Base Model 2</text>

      <rect x="0" y="76" width="95" height="30" rx="4" fill="#d1fae5" stroke="#10b981"/>
      <text x="47" y="95" font-family="'Space Grotesk', sans-serif" font-size="10.5px" font-weight="600" fill="#064e3b" text-anchor="middle">Base Model 3</text>
    </g>

    <text x="135" y="110" font-family="'Space Grotesk', sans-serif" font-size="16px" fill="#059669">➔</text>

    <!-- Meta-Learner -->
    <g transform="translate(160, 60)">
      <rect x="0" y="0" width="185" height="90" rx="6" fill="#065f46"/>
      <text x="92" y="25" font-family="'Space Grotesk', sans-serif" font-size="10px" font-weight="700" fill="#34d399" text-anchor="middle">LEVEL 1 META-LEARNER (5-Fold CV)</text>
      <text x="92" y="48" font-family="'Outfit', sans-serif" font-size="12px" font-weight="700" fill="#ffffff" text-anchor="middle">Logistic / Linear Regression</text>
      <text x="92" y="72" font-family="'Space Grotesk', sans-serif" font-size="9.5px" fill="#a7f3d0" text-anchor="middle">Learns Optimal Blending Weights</text>
    </g>
  </g>
</svg>