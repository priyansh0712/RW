<svg width="800" height="185" viewBox="0 0 800 185" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');
      .algo-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 8px; }
      .algo-name { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; }
      .algo-desc { font-family: 'Outfit', sans-serif; font-size: 10.5px; fill: #475569; }
      @media (prefers-color-scheme: dark) {
        .algo-card { fill: #0f172a; stroke: #1e293b; }
        .algo-desc { fill: #94a3b8; }
      }
    </style>
  </defs>

  <rect width="800" height="185" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Card 1: AdaBoost -->
  <g transform="translate(15, 14)">
    <rect x="0" y="0" width="180" height="157" class="algo-card"/>
    <rect x="0" y="0" width="180" height="4" rx="2" fill="#f59e0b"/>
    <text x="14" y="24" class="algo-name" fill="#b45309">AdaBoost</text>
    <text x="14" y="44" class="algo-desc">• Adaptive Sample Weighting</text>
    <text x="14" y="64" class="algo-desc">• Exponential loss objective</text>
    <text x="14" y="84" class="algo-desc">• Base: Shallow decision stumps</text>
    <text x="14" y="104" class="algo-desc">• Multi-class via SAMME</text>
    <rect x="14" y="120" width="152" height="24" rx="4" fill="#fef3c7"/>
    <text x="90" y="136" font-family="'Space Grotesk', sans-serif" font-size="9.5px" font-weight="700" fill="#92400e" text-anchor="middle">Instance Rescaling</text>
  </g>

  <!-- Card 2: Gradient Boosting -->
  <g transform="translate(208, 14)">
    <rect x="0" y="0" width="180" height="157" class="algo-card" style="stroke:#10b981; stroke-width:1.8;"/>
    <rect x="0" y="0" width="180" height="4" rx="2" fill="#10b981"/>
    <text x="14" y="24" class="algo-name" fill="#047857">Gradient Boosting</text>
    <text x="14" y="44" class="algo-desc">• Gradient descent on loss</text>
    <text x="14" y="64" class="algo-desc">• Arbitrary loss functions</text>
    <text x="14" y="84" class="algo-desc">• Learning rate shrinkage η</text>
    <text x="14" y="104" class="algo-desc">• Champion Classification (72.4%)</text>
    <rect x="14" y="120" width="152" height="24" rx="4" fill="#d1fae5"/>
    <text x="90" y="136" font-family="'Space Grotesk', sans-serif" font-size="9.5px" font-weight="700" fill="#065f46" text-anchor="middle">Pseudo-Residual Descent</text>
  </g>

  <!-- Card 3: LightGBM -->
  <g transform="translate(401, 14)">
    <rect x="0" y="0" width="180" height="157" class="algo-card"/>
    <rect x="0" y="0" width="180" height="4" rx="2" fill="#06b6d4"/>
    <text x="14" y="24" class="algo-name" fill="#0891b2">LightGBM</text>
    <text x="14" y="44" class="algo-desc">• Histogram-based binning</text>
    <text x="14" y="64" class="algo-desc">• Leaf-wise (best-first) tree</text>
    <text x="14" y="84" class="algo-desc">• GOSS gradient sampling</text>
    <text x="14" y="104" class="algo-desc">• Exclusive Feature Bundling</text>
    <rect x="14" y="120" width="152" height="24" rx="4" fill="#cffafe"/>
    <text x="90" y="136" font-family="'Space Grotesk', sans-serif" font-size="9.5px" font-weight="700" fill="#155e75" text-anchor="middle">Ultra-Fast Histogram</text>
  </g>

  <!-- Card 4: XGBoost -->
  <g transform="translate(594, 14)">
    <rect x="0" y="0" width="190" height="157" class="algo-card"/>
    <rect x="0" y="0" width="190" height="4" rx="2" fill="#ec4899"/>
    <text x="14" y="24" class="algo-name" fill="#be185d">XGBoost</text>
    <text x="14" y="44" class="algo-desc">• 2nd-order Taylor (gᵢ, hᵢ)</text>
    <text x="14" y="64" class="algo-desc">• Explicit L1/L2 tree regularization</text>
    <text x="14" y="84" class="algo-desc">• Sparsity-aware split finder</text>
    <text x="14" y="104" class="algo-desc">• Top Standalone Acc (73.5%)</text>
    <rect x="14" y="120" width="162" height="24" rx="4" fill="#fce7f3"/>
    <text x="95" y="136" font-family="'Space Grotesk', sans-serif" font-size="9.5px" font-weight="700" fill="#9d174d" text-anchor="middle">Taylor Regularized Splitting</text>
  </g>
</svg>