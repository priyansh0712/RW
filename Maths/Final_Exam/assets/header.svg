<svg width="800" height="220" viewBox="0 0 800 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');
      
      .title {
        font-family: 'Outfit', sans-serif;
        font-weight: 800;
        font-size: 32px;
        fill: url(#title-grad);
        animation: text-pulse 4s ease-in-out infinite;
      }
      
      .subtitle-top {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 2px;
        fill: #10b981;
        animation: fade-in 1.5s ease-out forwards;
      }
      
      .subtitle-bottom {
        font-family: 'Outfit', sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #475569;
        animation: slide-up 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      .grid-line {
        stroke: #e2e8f0;
        stroke-dasharray: 4 4;
        animation: grid-draw 2s ease-out forwards;
      }
      
      .bar {
        animation: bar-grow 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        transform-origin: bottom;
      }
      
      .bar-1 { fill: #10b981; animation-delay: 0.3s; }
      .bar-2 { fill: #6366f1; animation-delay: 0.5s; }
      .bar-3 { fill: #f59e0b; animation-delay: 0.7s; }
      .bar-4 { fill: #ef4444; animation-delay: 0.9s; }
      .bar-5 { fill: #8b5cf6; animation-delay: 1.1s; }
      
      .curve {
        stroke: #ec4899;
        stroke-width: 2.5;
        fill: none;
        stroke-dasharray: 300;
        stroke-dashoffset: 300;
        animation: curve-draw 2.5s ease-out 1s forwards;
      }
      
      .axis-line {
        stroke: #94a3b8;
        stroke-width: 1.5;
      }
      
      .badge {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 10px;
        font-weight: 700;
        fill: #ffffff;
      }
      
      .badge-bg {
        fill: #064e3b;
        rx: 10px;
        animation: fade-in 1s ease-out 2.5s forwards;
        opacity: 0;
      }
      
      .badge-text {
        animation: fade-in 1s ease-out 2.5s forwards;
        opacity: 0;
      }

      @media (prefers-color-scheme: dark) {
        .subtitle-bottom { fill: #94a3b8; }
        .grid-line { stroke: #1e293b; }
        .axis-line { stroke: #475569; }
        .badge-bg { fill: #022c22; }
      }
      
      @keyframes fade-in {
        to { opacity: 1; }
      }
      @keyframes slide-up {
        from { transform: translateY(15px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      @keyframes text-pulse {
        0%, 100% { filter: drop-shadow(0 0 2px rgba(16, 185, 129, 0.2)); }
        50% { filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.4)); }
      }
      @keyframes grid-draw {
        from { stroke-dashoffset: 40; opacity: 0; }
        to { stroke-dashoffset: 0; opacity: 0.4; }
      }
      @keyframes bar-grow {
        from { transform: scaleY(0); opacity: 0; }
        to { transform: scaleY(1); opacity: 1; }
      }
      @keyframes curve-draw {
        to { stroke-dashoffset: 0; }
      }
    </style>
    
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Bar Chart -->
  <g id="chart" transform="translate(30, 20)">
    <!-- Grid Lines -->
    <line x1="0" y1="40" x2="190" y2="40" class="grid-line" />
    <line x1="0" y1="80" x2="190" y2="80" class="grid-line" />
    <line x1="0" y1="120" x2="190" y2="120" class="grid-line" />
    <line x1="0" y1="160" x2="190" y2="160" class="grid-line" />
    
    <!-- Axes -->
    <line x1="10" y1="0" x2="10" y2="180" class="axis-line" />
    <line x1="10" y1="180" x2="200" y2="180" class="axis-line" />
    
    <!-- Bars -->
    <rect x="25" y="40" width="25" height="140" class="bar bar-1" rx="3" opacity="0" />
    <rect x="60" y="80" width="25" height="100" class="bar bar-2" rx="3" opacity="0" />
    <rect x="95" y="55" width="25" height="125" class="bar bar-3" rx="3" opacity="0" />
    <rect x="130" y="100" width="25" height="80" class="bar bar-4" rx="3" opacity="0" />
    <rect x="165" y="60" width="25" height="120" class="bar bar-5" rx="3" opacity="0" />
    
    <!-- Normal Curve Overlay -->
    <path d="M 25 160 Q 60 140 95 60 Q 130 30 165 50 Q 185 70 195 100" class="curve" />
  </g>

  <!-- Typography Content -->
  <g id="text-content">
    <text x="260" y="60" class="subtitle-top">MATHEMATICS FOR DATA SCIENCE</text>
    <text x="260" y="110" class="title">Final Examination</text>
    <text x="260" y="145" class="subtitle-bottom">Loan Applications — Statistics, Probability &amp; Linear Algebra</text>
    
    <!-- Tech pills/badges -->
    <rect x="260" y="175" width="80" height="20" class="badge-bg" />
    <text x="300" y="189" text-anchor="middle" class="badge badge-text">STATISTICS</text>
    
    <rect x="347" y="175" width="85" height="20" class="badge-bg" />
    <text x="389.5" y="189" text-anchor="middle" class="badge badge-text">PROBABILITY</text>
    
    <rect x="439" y="175" width="95" height="20" class="badge-bg" />
    <text x="486.5" y="189" text-anchor="middle" class="badge badge-text">DISTRIBUTIONS</text>

    <rect x="541" y="175" width="100" height="20" class="badge-bg" />
    <text x="591" y="189" text-anchor="middle" class="badge badge-text">LINEAR ALGEBRA</text>
  </g>
</svg>
