<svg width="800" height="300" viewBox="0 0 800 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');
      
      .panel-bg {
        fill: #f8fafc;
        stroke: #e2e8f0;
        stroke-width: 1.5;
        rx: 16px;
      }
      
      .panel-title {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 1.5px;
        fill: #475569;
        text-transform: uppercase;
      }
      
      .label-text {
        font-family: 'Outfit', sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #0f172a;
      }
      
      .sub-text {
        font-family: 'Outfit', sans-serif;
        font-weight: 400;
        font-size: 11px;
        fill: #64748b;
      }
      
      .math-text {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
        font-size: 12px;
        fill: #4f46e5;
      }
      
      .venn-circle-a {
        fill: #6366f1;
        fill-opacity: 0.2;
        stroke: #6366f1;
        stroke-width: 2;
      }
      
      .venn-circle-b {
        fill: #10b981;
        fill-opacity: 0.2;
        stroke: #10b981;
        stroke-width: 2;
      }
      
      .venn-intersect {
        fill: #8b5cf6;
        fill-opacity: 0.3;
      }
      
      .table-header {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 10px;
        fill: #475569;
        text-anchor: middle;
      }
      
      .table-cell {
        font-family: 'Outfit', sans-serif;
        font-weight: 500;
        font-size: 10px;
        fill: #0f172a;
        text-anchor: middle;
      }
      
      .table-border {
        stroke: #e2e8f0;
        stroke-width: 1px;
      }
      
      .tree-node {
        fill: #6366f1;
        stroke: #ffffff;
        stroke-width: 1.5px;
      }
      
      .tree-line {
        stroke: #cbd5e1;
        stroke-width: 1.5px;
      }
      
      @media (prefers-color-scheme: dark) {
        .panel-bg {
          fill: #0f172a;
          stroke: #1e293b;
        }
        .panel-title {
          fill: #94a3b8;
        }
        .label-text {
          fill: #f8fafc;
        }
        .sub-text {
          fill: #64748b;
        }
        .math-text {
          fill: #818cf8;
        }
        .table-cell {
          fill: #e2e8f0;
        }
        .table-border {
          stroke: #334155;
        }
        .tree-line {
          stroke: #475569;
        }
        .venn-circle-a {
          fill: #818cf8;
          fill-opacity: 0.25;
          stroke: #818cf8;
        }
        .venn-circle-b {
          fill: #34d399;
          fill-opacity: 0.25;
          stroke: #34d399;
        }
      }
    </style>
  </defs>

  <!-- Panel 1: CONTINGENCY TABLE -->
  <g transform="translate(15, 15)">
    <rect width="240" height="270" class="panel-bg" />
    <text x="120" y="35" text-anchor="middle" class="panel-title">1. Probability Basics</text>
    <text x="120" y="55" text-anchor="middle" class="label-text">Contingency (Frequency) Table</text>
    
    <!-- Table Representation -->
    <g transform="translate(25, 75)">
      <!-- Background grid headers -->
      <rect x="0" y="0" width="190" height="20" fill="#cbd5e1" fill-opacity="0.2" rx="4" />
      <rect x="0" y="0" width="60" height="120" fill="#cbd5e1" fill-opacity="0.1" rx="4" />
      
      <!-- Horizontal lines -->
      <line x1="0" y1="0" x2="190" y2="0" class="table-border" />
      <line x1="0" y1="20" x2="190" y2="20" class="table-border" stroke-width="1.5" />
      <line x1="0" y1="40" x2="190" y2="40" class="table-border" />
      <line x1="0" y1="60" x2="190" y2="60" class="table-border" />
      <line x1="0" y1="80" x2="190" y2="80" class="table-border" />
      <line x1="0" y1="100" x2="190" y2="100" class="table-border" stroke-width="1.5" />
      <line x1="0" y1="120" x2="190" y2="120" class="table-border" />
      
      <!-- Vertical lines -->
      <line x1="0" y1="0" x2="0" y2="120" class="table-border" />
      <line x1="60" y1="0" x2="60" y2="120" class="table-border" />
      <line x1="105" y1="0" x2="105" y2="120" class="table-border" />
      <line x1="150" y1="0" x2="150" y2="120" class="table-border" />
      <line x1="190" y1="0" x2="190" y2="120" class="table-border" />
      
      <!-- Text Labels -->
      <text x="30" y="14" class="table-header">CREDIT SCORE</text>
      <text x="82.5" y="14" class="table-header">DEFAULT (A)</text>
      <text x="127.5" y="14" class="table-header">PAID (B)</text>
      <text x="170" y="14" class="table-header">TOTAL</text>
      
      <!-- Rows -->
      <text x="30" y="34" class="table-cell" style="font-weight:600;">&lt; 600 (Low)</text>
      <text x="82.5" y="34" class="table-cell">340</text>
      <text x="127.5" y="34" class="table-cell">520</text>
      <text x="170" y="34" class="table-cell" style="font-weight:600;">860</text>
      
      <text x="30" y="54" class="table-cell" style="font-weight:600;">600 - 700</text>
      <text x="82.5" y="54" class="table-cell">412</text>
      <text x="127.5" y="54" class="table-cell">1,820</text>
      <text x="170" y="54" class="table-cell" style="font-weight:600;">2,232</text>
      
      <text x="30" y="74" class="table-cell" style="font-weight:600;">&gt; 700 (High)</text>
      <text x="82.5" y="74" class="table-cell">174</text>
      <text x="127.5" y="74" class="table-cell">1,734</text>
      <text x="170" y="74" class="table-cell" style="font-weight:600;">1,908</text>
      
      <text x="30" y="94" class="table-cell" style="font-weight:600;">Other</text>
      <text x="82.5" y="94" class="table-cell">0</text>
      <text x="127.5" y="94" class="table-cell">0</text>
      <text x="170" y="94" class="table-cell" style="font-weight:600;">0</text>

      <text x="30" y="114" class="table-header">TOTAL</text>
      <text x="82.5" y="114" class="table-cell" style="font-weight:600;">926</text>
      <text x="127.5" y="114" class="table-cell" style="font-weight:600;">4,074</text>
      <text x="170" y="114" class="table-cell" style="font-weight:700; fill:#4f46e5;">5,000</text>
    </g>
    
    <text x="120" y="248" text-anchor="middle" class="sub-text">Empirical default rate: 926 / 5000 = 18.52%</text>
  </g>

  <!-- Panel 2: VENN & TREE DIAGRAMS -->
  <g transform="translate(280, 15)">
    <rect width="240" height="270" class="panel-bg" />
    <text x="120" y="35" text-anchor="middle" class="panel-title">2. Intersection &amp; Trees</text>
    <text x="120" y="55" text-anchor="middle" class="label-text">Visualizing Compound Events</text>
    
    <!-- Venn Diagram (Top half of panel) -->
    <g transform="translate(30, 70)">
      <circle cx="70" cy="45" r="35" class="venn-circle-a" />
      <circle cx="110" cy="45" r="35" class="venn-circle-b" />
      
      <!-- Intersection Region (Simulated with clip/path, or just text labels overlay) -->
      <text x="50" y="48" fill="#4f46e5" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle">A</text>
      <text x="130" y="48" fill="#059669" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" text-anchor="middle">B</text>
      <text x="90" y="48" fill="#7c3aed" font-family="'Outfit', sans-serif" font-weight="700" font-size="10" text-anchor="middle">A ∩ B</text>
      <text x="90" y="92" text-anchor="middle" class="sub-text">Venn: Intersection (A and B)</text>
    </g>
    
    <!-- Tree Diagram (Bottom half of panel) -->
    <g transform="translate(25, 175)">
      <!-- Lines -->
      <line x1="95" y1="10" x2="55" y2="35" class="tree-line" />
      <line x1="95" y1="10" x2="135" y2="35" class="tree-line" />
      
      <line x1="55" y1="35" x2="35" y2="60" class="tree-line" />
      <line x1="55" y1="35" x2="75" y2="60" class="tree-line" />
      
      <line x1="135" y1="35" x2="115" y2="60" class="tree-line" />
      <line x1="135" y1="35" x2="155" y2="60" class="tree-line" />
      
      <!-- Nodes -->
      <circle cx="95" cy="10" r="5" class="tree-node" />
      
      <circle cx="55" cy="35" r="6" class="tree-node" fill="#10b981" />
      <circle cx="135" cy="35" r="6" class="tree-node" fill="#ef4444" />
      
      <circle cx="35" cy="60" r="4" class="tree-node" />
      <circle cx="75" cy="60" r="4" class="tree-node" />
      <circle cx="115" cy="60" r="4" class="tree-node" />
      <circle cx="155" cy="60" r="4" class="tree-node" />
      
      <!-- Labels -->
      <text x="95" y="-2" text-anchor="middle" class="sub-text" style="font-size:9px;">All Loans</text>
      <text x="35" y="38" text-anchor="middle" class="sub-text" style="font-size:9px; fill:#10b981; font-weight:600;">Score ≥ 600</text>
      <text x="158" y="38" text-anchor="middle" class="sub-text" style="font-size:9px; fill:#ef4444; font-weight:600;">Score &lt; 600</text>
      <text x="95" y="75" text-anchor="middle" class="sub-text">Probability Tree Analysis</text>
    </g>
  </g>

  <!-- Panel 3: FORMULAS & BAYES -->
  <g transform="translate(545, 15)">
    <rect width="240" height="270" class="panel-bg" />
    <text x="120" y="35" text-anchor="middle" class="panel-title">3. Probability Formulas</text>
    <text x="120" y="55" text-anchor="middle" class="label-text">Bayes' &amp; Conditional Rules</text>
    
    <!-- Formulas -->
    <g transform="translate(20, 75)">
      <!-- Formula 1: Conditional -->
      <rect width="200" height="50" rx="8" fill="#e0e7ff" fill-opacity="0.5" />
      <text x="10" y="20" class="sub-text" style="font-weight:600; fill:#4f46e5;">Conditional Probability:</text>
      <text x="10" y="40" class="math-text">P(A|B) = P(A ∩ B) / P(B)</text>
      
      <!-- Formula 2: Bayes -->
      <rect y="65" width="200" height="85" rx="8" fill="#e2f5ea" fill-opacity="0.5" />
      <text x="10" y="85" class="sub-text" style="font-weight:600; fill:#059669;">Bayes' Theorem:</text>
      <text x="10" y="107" class="math-text" fill="#059669">P(A|B) = P(B|A) · P(A) / P(B)</text>
      <text x="10" y="132" class="sub-text" style="font-size:9px; fill:#059669;">Prior Probability updated by New Evidence</text>
    </g>
    
    <!-- Real-world Application text box -->
    <rect x="20" y="235" width="200" height="20" rx="4" fill="#f1f5f9" />
    <text x="120" y="248" text-anchor="middle" class="sub-text" style="font-size:9px; font-weight:600;">Used by Banks for Risk Modeling</text>
    
    <text x="120" y="222" text-anchor="middle" class="sub-text">P(Default | Low Score) ≈ 39.53%</text>
  </g>
</svg>
