<svg width="800" height="55" viewBox="0 0 800 55" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600&amp;family=Space+Grotesk:wght@500&amp;display=swap');
      
      .title-text {
        font-family: 'Outfit', sans-serif;
        font-weight: 600;
        font-size: 20px;
        fill: #0f172a;
        animation: slide-right 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      .icon-circle {
        fill: url(#icon-grad);
        animation: pulse 3s infinite alternate;
      }
      
      .divider-line {
        stroke: url(#line-grad);
        stroke-width: 2;
        stroke-dasharray: 800;
        stroke-dashoffset: 800;
        animation: line-reveal 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      
      @media (prefers-color-scheme: dark) {
        .title-text {
          fill: #f8fafc;
        }
      }
      
      @keyframes slide-right {
        from { transform: translateX(-10px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      
      @keyframes line-reveal {
        to { stroke-dashoffset: 0; }
      }
      
      @keyframes pulse {
        0% { filter: drop-shadow(0 0 2px rgba(99, 102, 241, 0.4)); }
        100% { filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.8)); }
      }
    </style>
    
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#ec4899" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <g transform="translate(5, 5)">
    <!-- Icon Container -->
    <circle cx="20" cy="20" r="16" class="icon-circle" />
    <!-- SVG Icon (Gear/Wrench hybrid) -->
    <path d="M20 14 A6 6 0 1 0 20 26 A6 6 0 1 0 20 14 M20 10 V12 M20 28 V30 M10 20 H12 M28 20 H30 M13 13 L15 15 M25 25 L27 27 M13 27 L15 25 M25 13 L27 15" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Text -->
    <text x="50" y="27" class="title-text">Tools Used</text>
    <!-- Divider Line -->
    <line x1="0" y1="45" x2="800" y2="45" class="divider-line" />
  </g>
</svg>
